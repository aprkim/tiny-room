<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Watermark Design Sandbox — TinyRoom</title>
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        :root {
            --bg: #0f172a; --card: #111827; --soft: #1f2937; --border: #273244;
            --text: #e5e7eb; --muted: #9ca3af; --muted2: #6b7280;
            --accent: #0EA5A4; --accentHover: #14b8a6;
            --sans: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial;
        }
        body {
            font-family: var(--sans);
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 24px;
            gap: 20px;
        }
        h1 { font-size: 20px; font-weight: 800; color: var(--accent); }
        .sub { font-size: 13px; color: var(--muted); margin-top: -12px; text-align:center; max-width: 560px; }

        .stage {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
            justify-content: center;
            width: 100%;
        }

        /* Realistic video tile */
        .tile {
            position: relative;
            width: 420px;
            max-width: 100%;
            aspect-ratio: 16 / 9;
            border-radius: 16px;
            overflow: hidden;
            border: 1px solid var(--border);
            background: linear-gradient(135deg, #2a3f5f 0%, #1a2a44 100%);
        }
        .tile.light-bg { background: linear-gradient(135deg, #cfd9e8 0%, #aebfd6 100%); }
        .tile.busy-bg {
            background-image:
                repeating-linear-gradient(45deg, #3a4a6a 0, #3a4a6a 12px, #46587c 12px, #46587c 24px);
        }
        .tile .initials {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 48px;
            font-weight: 700;
            color: rgba(255,255,255,0.25);
        }
        .member-info {
            position: absolute;
            bottom: 0; left: 0; right: 0;
            padding: 8px 10px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: linear-gradient(transparent, rgba(0,0,0,.5));
        }
        .member-name { font-size: 12px; font-weight: 600; color: #fff; text-shadow: 0 1px 3px rgba(0,0,0,.4); }

        /* THE WATERMARK — styled live via JS */
        .makedo-watermark {
            position: absolute;
            pointer-events: none;
            z-index: 10;
            display: flex;
            align-items: center;
            gap: 4px;
            white-space: nowrap;
        }
        .makedo-watermark svg { display: block; }

        /* Controls panel */
        .controls {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 18px 20px;
            width: 420px;
            max-width: 100%;
            display: flex;
            flex-direction: column;
            gap: 14px;
        }
        .ctrl-group { display: flex; flex-direction: column; gap: 6px; }
        .ctrl-group label { font-size: 12px; font-weight: 600; color: var(--muted); }
        .ctrl-row { display: flex; gap: 8px; flex-wrap: wrap; }
        .controls input[type="text"], .controls select {
            width: 100%;
            padding: 8px 10px;
            border: 1px solid var(--border);
            border-radius: 8px;
            background: var(--soft);
            color: var(--text);
            font-size: 13px;
            font-family: var(--sans);
        }
        .controls input[type="range"] { width: 100%; accent-color: var(--accent); }
        .controls input[type="color"] { width: 44px; height: 32px; border: none; background: none; cursor: pointer; }
        .seg { display: flex; gap: 6px; flex-wrap: wrap; }
        .seg button {
            padding: 6px 10px;
            border: 1px solid var(--border);
            background: var(--soft);
            color: var(--text);
            border-radius: 8px;
            font-size: 12px;
            cursor: pointer;
        }
        .seg button.active { background: var(--accent); border-color: var(--accent); color: #fff; }
        .val { font-size: 11px; color: var(--muted2); }
        .css-out {
            background: #0a0f1c;
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 12px;
            font-family: ui-monospace, monospace;
            font-size: 11px;
            color: #a7f3d0;
            white-space: pre-wrap;
            word-break: break-all;
            width: 420px;
            max-width: 100%;
        }
        .bg-toggle { display: flex; gap: 6px; }
    </style>
</head>
<body>
    <h1>Watermark Design Sandbox</h1>
    <p class="sub">Design the <code>.makedo-watermark</code> that the SDK injects. Tweak below; the CSS at the bottom is what you'd apply to override the SDK's inline styles. Tip: use <code>!important</code> when overriding SDK inline styles.</p>

    <div class="stage">
        <div class="tile" id="tile">
            <div class="initials" id="tileInitials">AK</div>
            <div class="makedo-watermark" id="watermark"></div>
            <div class="member-info">
                <span class="member-name">April (You)</span>
            </div>
        </div>

        <div class="controls">
            <div class="ctrl-group">
                <label>Text</label>
                <input type="text" id="wmText" value="Powered by VibeLive">
            </div>

            <div class="ctrl-group">
                <label>Logo icon</label>
                <div class="seg" id="logoSeg">
                    <button data-logo="none" class="active">None</button>
                    <button data-logo="dot">● Dot</button>
                    <button data-logo="spark">✦ Spark</button>
                    <button data-logo="play">▶ Play</button>
                </div>
            </div>

            <div class="ctrl-group">
                <label>Position</label>
                <div class="seg" id="posSeg">
                    <button data-pos="tr" class="active">Top-right</button>
                    <button data-pos="tl">Top-left</button>
                    <button data-pos="br">Bottom-right</button>
                    <button data-pos="bl">Bottom-left</button>
                </div>
            </div>

            <div class="ctrl-group">
                <label>Font size: <span class="val" id="sizeVal">9px</span></label>
                <input type="range" id="wmSize" min="7" max="16" value="9">
            </div>

            <div class="ctrl-group">
                <label>Opacity: <span class="val" id="opVal">0.35</span></label>
                <input type="range" id="wmOpacity" min="10" max="100" value="35">
            </div>

            <div class="ctrl-group">
                <label>Letter spacing: <span class="val" id="lsVal">1px</span></label>
                <input type="range" id="wmLs" min="0" max="4" step="0.5" value="1">
            </div>

            <div class="ctrl-row">
                <div class="ctrl-group" style="flex:1">
                    <label>Color</label>
                    <input type="color" id="wmColor" value="#ffffff">
                </div>
                <div class="ctrl-group" style="flex:1">
                    <label>Weight</label>
                    <select id="wmWeight">
                        <option value="400">Regular</option>
                        <option value="500">Medium</option>
                        <option value="600" selected>Semibold</option>
                        <option value="700">Bold</option>
                    </select>
                </div>
            </div>

            <div class="ctrl-group">
                <label>Pill background</label>
                <div class="seg" id="pillSeg">
                    <button data-pill="none" class="active">None</button>
                    <button data-pill="dark">Dark</button>
                    <button data-pill="accent">Accent</button>
                    <button data-pill="blur">Glass</button>
                </div>
            </div>

            <div class="ctrl-group">
                <label>Tile background (preview only)</label>
                <div class="seg bg-toggle" id="bgSeg">
                    <button data-bg="dark" class="active">Dark video</button>
                    <button data-bg="light">Light video</button>
                    <button data-bg="busy">Busy video</button>
                </div>
            </div>
        </div>
    </div>

    <div class="css-out" id="cssOut"></div>

    <script>
    (function () {
        const $ = id => document.getElementById(id);
        const wm = $('watermark');
        const tile = $('tile');

        const state = {
            text: 'Powered by VibeLive',
            logo: 'none',
            pos: 'tr',
            size: 9,
            opacity: 0.35,
            ls: 1,
            color: '#ffffff',
            weight: 600,
            pill: 'none',
        };

        const LOGOS = {
            none: '',
            dot: '<svg width="6" height="6" viewBox="0 0 6 6"><circle cx="3" cy="3" r="3" fill="currentColor"/></svg>',
            spark: '<svg width="10" height="10" viewBox="0 0 24 24" fill="currentColor"><path d="M12 0l2.4 9.6L24 12l-9.6 2.4L12 24l-2.4-9.6L0 12l9.6-2.4z"/></svg>',
            play: '<svg width="9" height="9" viewBox="0 0 24 24" fill="currentColor"><path d="M5 3l14 9-14 9z"/></svg>',
        };

        function hexToRgba(hex, a) {
            const n = parseInt(hex.slice(1), 16);
            return `rgba(${(n>>16)&255}, ${(n>>8)&255}, ${n&255}, ${a})`;
        }

        function render() {
            // content
            wm.innerHTML = (LOGOS[state.logo] || '') + `<span>${state.text.replace(/</g,'&lt;')}</span>`;

            // position
            wm.style.top = wm.style.bottom = wm.style.left = wm.style.right = 'auto';
            const m = '8px';
            if (state.pos === 'tr') { wm.style.top = m; wm.style.right = m; }
            if (state.pos === 'tl') { wm.style.top = m; wm.style.left = m; }
            if (state.pos === 'br') { wm.style.bottom = '34px'; wm.style.right = m; }
            if (state.pos === 'bl') { wm.style.bottom = '34px'; wm.style.left = m; }

            wm.style.fontSize = state.size + 'px';
            wm.style.color = hexToRgba(state.color, state.opacity);
            wm.style.letterSpacing = state.ls + 'px';
            wm.style.fontWeight = state.weight;

            // pill
            wm.style.padding = state.pill === 'none' ? '0' : '3px 8px';
            wm.style.borderRadius = state.pill === 'none' ? '0' : '999px';
            wm.style.backdropFilter = '';
            if (state.pill === 'none') wm.style.background = 'transparent';
            if (state.pill === 'dark') wm.style.background = 'rgba(0,0,0,0.45)';
            if (state.pill === 'accent') wm.style.background = 'rgba(14,165,164,0.55)';
            if (state.pill === 'blur') { wm.style.background = 'rgba(255,255,255,0.12)'; wm.style.backdropFilter = 'blur(6px)'; }

            renderCss();
        }

        function renderCss() {
            const posLines = {
                tr: 'top: 8px; right: 8px;',
                tl: 'top: 8px; left: 8px;',
                br: 'bottom: 8px; right: 8px;',
                bl: 'bottom: 8px; left: 8px;',
            }[state.pos];
            let pill = '';
            if (state.pill === 'dark') pill = '\n    background: rgba(0,0,0,0.45) !important;\n    padding: 3px 8px !important;\n    border-radius: 999px !important;';
            if (state.pill === 'accent') pill = '\n    background: rgba(14,165,164,0.55) !important;\n    padding: 3px 8px !important;\n    border-radius: 999px !important;';
            if (state.pill === 'blur') pill = '\n    background: rgba(255,255,255,0.12) !important;\n    backdrop-filter: blur(6px) !important;\n    padding: 3px 8px !important;\n    border-radius: 999px !important;';
            $('cssOut').textContent =
`.makedo-watermark {
    ${posLines}
    font-size: ${state.size}px !important;
    font-weight: ${state.weight} !important;
    color: ${hexToRgba(state.color, state.opacity)} !important;
    letter-spacing: ${state.ls}px !important;${pill}
}`;
        }

        // Wire controls
        $('wmText').addEventListener('input', e => { state.text = e.target.value; render(); });
        $('wmSize').addEventListener('input', e => { state.size = +e.target.value; $('sizeVal').textContent = state.size + 'px'; render(); });
        $('wmOpacity').addEventListener('input', e => { state.opacity = +e.target.value / 100; $('opVal').textContent = state.opacity.toFixed(2); render(); });
        $('wmLs').addEventListener('input', e => { state.ls = +e.target.value; $('lsVal').textContent = state.ls + 'px'; render(); });
        $('wmColor').addEventListener('input', e => { state.color = e.target.value; render(); });
        $('wmWeight').addEventListener('change', e => { state.weight = +e.target.value; render(); });

        function segHandler(segId, key, after) {
            $(segId).addEventListener('click', e => {
                const btn = e.target.closest('button');
                if (!btn) return;
                [...$(segId).children].forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                state[key] = btn.dataset[key === 'pos' ? 'pos' : key === 'logo' ? 'logo' : key === 'pill' ? 'pill' : 'bg'];
                if (after) after(btn);
                render();
            });
        }
        segHandler('logoSeg', 'logo');
        segHandler('posSeg', 'pos');
        segHandler('pillSeg', 'pill');

        $('bgSeg').addEventListener('click', e => {
            const btn = e.target.closest('button');
            if (!btn) return;
            [...$('bgSeg').children].forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            tile.className = 'tile' + (btn.dataset.bg === 'light' ? ' light-bg' : btn.dataset.bg === 'busy' ? ' busy-bg' : '');
        });

        render();
    })();
    </script>
</body>
</html>
