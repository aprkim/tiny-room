<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Watermark v2 — Mobile preview</title>
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        :root {
            --bg: #0f172a; --card: #111827; --border: #273244;
            --text: #e5e7eb; --muted: #9ca3af; --accent: #0EA5A4;
            --sans: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial;
        }
        body {
            font-family: var(--sans);
            background: #060c18;
            color: var(--text);
            min-height: 100vh;
            padding: 24px 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 22px;
        }
        h1 { font-size: 18px; font-weight: 800; color: var(--accent); text-align: center; }
        .sub { font-size: 12px; color: var(--muted); text-align: center; margin-top: -14px; max-width: 360px; }

        .scenarios { display: flex; flex-wrap: wrap; gap: 28px; justify-content: center; align-items: flex-start; }
        .scenario { display: flex; flex-direction: column; align-items: center; gap: 10px; }
        .scenario .caption { font-size: 12px; color: var(--muted); font-weight: 600; }

        /* Phone frame ~ 390px wide portrait */
        .phone {
            width: 300px;
            height: 600px;
            background: var(--bg);
            border: 8px solid #1e2738;
            border-radius: 32px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            box-shadow: 0 12px 40px rgba(0,0,0,0.5);
        }
        .topbar { padding: 8px 12px; background: var(--card); border-bottom: 1px solid var(--border); font-size: 12px; font-weight: 700; color: var(--accent); flex-shrink: 0; }
        .stage { flex: 1; min-height: 0; padding: 8px; display: flex; flex-direction: column; gap: 6px; overflow: hidden; }
        .controls-bar { flex-shrink: 0; padding: 10px; background: var(--card); border-top: 1px solid var(--border); display: flex; justify-content: center; gap: 8px; }
        .cbtn { width: 36px; height: 36px; border-radius: 10px; background: #1f2937; border: 1px solid var(--border); }

        .tile {
            position: relative;
            border-radius: 10px;
            overflow: hidden;
            border: 1px solid var(--border);
        }
        .bg-a { background: linear-gradient(135deg, #2a3f5f, #1a2a44); }
        .bg-b { background: linear-gradient(135deg, #3a5a4a, #1f3a2c); }
        .bg-c { background: linear-gradient(135deg, #e8eef6, #c5d2e6); }
        .bg-d { background-image: repeating-linear-gradient(45deg, #334155 0, #334155 9px, #475569 9px, #475569 18px); }
        .bg-screen { background: linear-gradient(135deg, #1e293b, #0f172a); }

        .initials {
            position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
            font-size: 22px; font-weight: 700; color: rgba(255,255,255,0.25);
        }
        .bg-c .initials { color: rgba(0,0,0,0.2); }
        .screen-content { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; color: rgba(255,255,255,0.3); font-size: 12px; font-weight: 600; }
        .member-info { position: absolute; bottom: 0; left: 0; right: 0; padding: 3px 6px; background: linear-gradient(transparent, rgba(0,0,0,.5)); }
        .member-name { font-size: 9px; font-weight: 600; color: #fff; text-shadow: 0 1px 2px rgba(0,0,0,.5); }

        /* layouts */
        .stack-2 { display: flex; flex-direction: column; gap: 6px; flex: 1; min-height: 0; }
        .stack-2 .tile { flex: 1; }
        .grid-4 { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; flex: 1; min-height: 0; }
        .pres { display: flex; flex-direction: column; gap: 6px; flex: 1; min-height: 0; }
        .pres .screen { flex: 4; min-height: 0; }
        .pres .strip { flex: 1; max-height: 24%; display: flex; gap: 5px; }
        .pres .strip .tile { flex: 1; }

        .toggle { position: sticky; bottom: 0; }
        .toggle button {
            background: var(--card); border: 1px solid var(--border); color: var(--text);
            border-radius: 8px; padding: 8px 14px; font-size: 12px; cursor: pointer;
        }
        .toggle button.active { background: var(--accent); border-color: var(--accent); color: #042f2e; }
    </style>
</head>
<body>
    <h1>Watermark v2 on Mobile</h1>
    <p class="sub">Phone portrait (~300px). Three real TinyRoom mobile layouts. Toggle to compare full vs scaled watermark.</p>

    <div class="toggle">
        <button id="scaleToggle">Scale down on small tiles: OFF</button>
    </div>

    <div class="scenarios" id="scenarios"></div>

    <script>
    function watermark(size) {
        // size: 'full' | 'small' | 'tiny'
        const map = { full: [10,'3px 8px'], small: [8,'2px 6px'], tiny: [7,'2px 5px'] };
        const [fs, pad] = map[size];
        return `<div class="makedo-watermark" style="position:absolute; top:5px; left:5px; display:inline-flex; align-items:center; font-size:${fs}px; color:rgba(255,255,255,0.92); background:rgba(15,23,41,0.65); backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px); padding:${pad}; border-radius:999px; border:0.5px solid rgba(255,255,255,0.12); letter-spacing:0.2px; pointer-events:none; z-index:10;">Powered by&nbsp;<span style="color:#5DCAA5; font-weight:500;">VibeLive</span></div>`;
    }

    let scaleDown = false;

    function tileHtml(cls, initials, name, wmSize) {
        return `<div class="tile ${cls}"><div class="initials">${initials}</div>${watermark(wmSize)}<div class="member-info"><span class="member-name">${name}</span></div></div>`;
    }
    function screenTile(wmSize) {
        return `<div class="tile bg-screen"><div class="screen-content">April's Screen</div>${watermark(wmSize)}<div class="member-info"><span class="member-name">April's Screen</span></div></div>`;
    }

    function phone(title, inner) {
        return `<div class="phone"><div class="topbar">TinyRoom</div><div class="stage">${inner}</div><div class="controls-bar"><div class="cbtn"></div><div class="cbtn"></div><div class="cbtn"></div></div></div>`;
    }

    function build() {
        const camSize = scaleDown ? 'small' : 'full';
        const stripSize = scaleDown ? 'tiny' : 'full';

        // Scenario 1: 2 people stacked (mobile stacks vertically)
        const s1 = phone('2p', `<div class="stack-2">
            ${tileHtml('bg-a','AK','April (You)', camSize)}
            ${tileHtml('bg-b','JL','Jordan', camSize)}
        </div>`);

        // Scenario 2: 4 people 2x2 grid
        const s2 = phone('4p', `<div class="grid-4">
            ${tileHtml('bg-a','AK','April', camSize)}
            ${tileHtml('bg-b','JL','Jordan', camSize)}
            ${tileHtml('bg-c','SC','Sam', camSize)}
            ${tileHtml('bg-d','RP','Riley', camSize)}
        </div>`);

        // Scenario 3: presentation (1 screen + camera strip)
        const s3 = phone('pres', `<div class="pres">
            <div class="screen">${screenTile(camSize)}</div>
            <div class="strip">
                ${tileHtml('bg-a','AK','You', stripSize)}
                ${tileHtml('bg-b','JL','Jordan', stripSize)}
                ${tileHtml('bg-c','SC','Sam', stripSize)}
            </div>
        </div>`);

        document.getElementById('scenarios').innerHTML = `
            <div class="scenario">${s1}<span class="caption">2 people (stacked)</span></div>
            <div class="scenario">${s2}<span class="caption">4 people (2×2)</span></div>
            <div class="scenario">${s3}<span class="caption">Screen share + strip</span></div>
        `;
    }

    document.getElementById('scaleToggle').addEventListener('click', function () {
        scaleDown = !scaleDown;
        this.textContent = 'Scale down on small tiles: ' + (scaleDown ? 'ON' : 'OFF');
        this.classList.toggle('active', scaleDown);
        build();
    });

    build();
    </script>
</body>
</html>
